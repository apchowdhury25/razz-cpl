{% extends "base.html" %}
{% block heading %}New vendor payment{% endblock %}
{% block content %}
<div class="card"><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<div class="grid grid-2">
<p><label>Date</label><input type="date" name="payment_date" required></p>
<p><label>Vendor</label><select name="vendor_id" required>{% for v in vendors %}<option value="{{ v.id }}">{{ v.name }}</option>{% endfor %}</select></p>
<p><label>Project</label><select name="project_id"><option value=""></option>{% for p in projects %}<option value="{{ p.id }}">{{ p.code }}</option>{% endfor %}</select></p>
<p><label>Amount</label><input name="amount" required></p>
<p><label>Cash / Bank</label><select name="money_account_id">{% for a in accounts %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}</select></p>
<p><label>Method</label><select name="payment_method">{% for m in ['CASH','CHEQUE','BANK_TRANSFER','MOBILE_BANKING','OTHER'] %}<option>{{ m }}</option>{% endfor %}</select></p>
<p><label>Cheque / ref</label><input name="reference_no"></p>
</div>
<p><label><input type="checkbox" name="is_advance" value="1"> Vendor advance / allow unallocated remainder</label></p>
<p><label>Notes</label><textarea name="notes"></textarea></p>
<h3>Allocate to outstanding bills</h3>
<table><tr><th>Bill</th><th>Vendor</th><th class="num">Outstanding</th><th>Allocate</th></tr>
{% for b in bills %}
<tr><td>{{ b.bill_no }}</td><td>{{ b.vendor.name if b.vendor else '' }}</td><td class="num">{{ b.outstanding_amount|money }}</td><td><input name="alloc_{{ b.id }}"></td></tr>
{% endfor %}
</table>
<button class="btn">{{ t('save') }}</button>
</form></div>
{% endblock %}
