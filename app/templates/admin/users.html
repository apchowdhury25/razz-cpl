{% extends "base.html" %}
{% block heading %}{{ t('users') }}{% endblock %}
{% block content %}
<div class="card"><form method="post" action="/admin/users/new"><input type="hidden" name="csrf" value="{{ csrf }}">
<div class="grid grid-2">
<p><label>Username</label><input name="username" required></p>
<p><label>Full name</label><input name="full_name" required></p>
<p><label>Email</label><input name="email"></p>
<p><label>Role</label><select name="role">{% for r in roles %}<option value="{{ r.value }}">{{ r.value }}</option>{% endfor %}</select></p>
<p><label>Password</label><input name="password" type="password" required></p>
</div>
<button class="btn">Add user</button>
</form></div>
<div class="card section"><table>
<tr><th>User</th><th>Name</th><th>Role</th><th>Active</th><th></th></tr>
{% for u in items %}
<tr>
<form method="post" action="/admin/users/{{ u.id }}">
<input type="hidden" name="csrf" value="{{ csrf }}">
<td>{{ u.username }}</td>
<td><input name="full_name" value="{{ u.full_name }}"></td>
<td><select name="role">{% for r in roles %}<option value="{{ r.value }}" {% if u.role==r.value %}selected{% endif %}>{{ r.value }}</option>{% endfor %}</select></td>
<td><input type="checkbox" name="is_active" value="1" {% if u.is_active %}checked{% endif %}></td>
<td><input name="password" placeholder="new password"><button class="btn secondary">Save</button></td>
</form>
</tr>
{% endfor %}
</table></div>
{% endblock %}
