{% extends "base.html" %}
{% block heading %}{{ t('periods') }}{% endblock %}
{% block content %}
<div class="card"><table>
<tr><th>Code</th><th>Name</th><th>Start</th><th>End</th><th>Locked</th><th></th></tr>
{% for p in items %}
<tr>
<td>{{ p.code }}</td><td>{{ p.name }}</td><td>{{ p.start_date|dmy }}</td><td>{{ p.end_date|dmy }}</td>
<td>{{ 'Yes' if p.is_locked else 'No' }}</td>
<td>
<form method="post" action="/admin/periods/{{ p.id }}/lock">
<input type="hidden" name="csrf" value="{{ csrf }}">
<input type="hidden" name="locked" value="{{ '0' if p.is_locked else '1' }}">
<button class="btn secondary">{{ 'Unlock' if p.is_locked else 'Lock' }}</button>
</form>
</td>
</tr>
{% endfor %}
</table></div>
{% endblock %}
