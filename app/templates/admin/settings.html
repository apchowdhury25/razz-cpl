{% extends "base.html" %}
{% block heading %}{{ t('settings') }}{% endblock %}
{% block content %}
<div class="card"><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<div class="grid grid-2">
<p><label>Company</label><input name="name" value="{{ item.name if item else '' }}"></p>
<p><label>বাংলা</label><input name="name_bn" value="{{ item.name_bn if item else '' }}"></p>
<p><label>Phone</label><input name="phone" value="{{ item.phone if item else '' }}"></p>
<p><label>Email</label><input name="email" value="{{ item.email if item else '' }}"></p>
<p><label>BIN</label><input name="bin_number" value="{{ item.bin_number if item else '' }}"></p>
<p><label>TIN</label><input name="tin_number" value="{{ item.tin_number if item else '' }}"></p>
<p><label>FY code</label><input name="fy_code" value="{{ item.fy_code if item else '' }}"></p>
<p><label>Current period</label><input name="current_period" value="{{ item.current_period if item else '' }}"></p>
<p><label>FY start</label><input type="date" name="fy_start" value="{{ item.fy_start.isoformat() if item else '' }}"></p>
<p><label>FY end</label><input type="date" name="fy_end" value="{{ item.fy_end.isoformat() if item else '' }}"></p>
</div>
<p><label>Address</label><textarea name="address">{{ item.address if item else '' }}</textarea></p>
<p><label>ঠিকানা</label><textarea name="address_bn">{{ item.address_bn if item else '' }}</textarea></p>
<button class="btn">{{ t('save') }}</button>
</form></div>
{% endblock %}
