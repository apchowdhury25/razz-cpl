{% extends "base.html" %}
{% block heading %}{{ 'Edit project' if item else 'New project' }}{% endblock %}
{% block content %}
<div class="card">
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="grid grid-2">
    <p><label>Code</label><input name="code" value="{{ item.code if item else '' }}" {% if item %}readonly{% endif %} required></p>
    <p><label>English name</label><input name="name" value="{{ item.name if item else '' }}" required></p>
    <p><label>বাংলা name</label><input name="name_bn" value="{{ item.name_bn if item else '' }}"></p>
    <p><label>Mode</label>
      <select name="mode">
        <option value="DEVELOPER" {% if item and item.mode=='DEVELOPER' %}selected{% endif %}>DEVELOPER</option>
        <option value="CONTRACTOR" {% if item and item.mode=='CONTRACTOR' %}selected{% endif %}>CONTRACTOR</option>
      </select>
    </p>
    <p><label>Client</label><input name="client_name" value="{{ item.client_name if item else '' }}"></p>
    <p><label>Status</label><input name="status" value="{{ item.status if item else 'ACTIVE' }}"></p>
    <p><label>Start date</label><input type="date" name="start_date" value="{{ item.start_date.isoformat() if item and item.start_date else '' }}"></p>
    <p><label>Expected completion</label><input type="date" name="expected_completion" value="{{ item.expected_completion.isoformat() if item and item.expected_completion else '' }}"></p>
    <p><label>Budget</label><input name="budget" value="{{ item.budget if item else '0' }}"></p>
    <p><label>Contract value</label><input name="contract_value" value="{{ item.contract_value if item else '0' }}"></p>
    <p><label>Retention %</label><input name="retention_percent" value="{{ item.retention_percent if item else '5' }}"></p>
  </div>
  <p><label>Address</label><textarea name="address">{{ item.address if item else '' }}</textarea></p>
  <p><label>Notes</label><textarea name="notes">{{ item.notes if item else '' }}</textarea></p>
  <button class="btn" type="submit">{{ t('save') }}</button>
</form>
</div>
{% endblock %}
